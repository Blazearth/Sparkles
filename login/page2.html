<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Preferences</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <video autoplay muted loop class="video">
            <source src="2.mp4" type="video/mp4"></source>
        </video>
    </div>
    <div class="container">
        <h1>Step 2: Preferences</h1>
        <form action="page3.html" method="get">
            <div class="form-group">
                <label>What are you looking for?</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="looking_for" value="friendship"> Friendship</label>
                    <label><input type="checkbox" name="looking_for" value="relationship"> Relationship</label>
                    <label><input type="checkbox" name="looking_for" value="casual"> Casual Dates</label>
                </div>
            </div>
            <div class="form-group">
                <label for="interests">What are your interests?</label>
                <textarea id="interests" name="interests" rows="4" placeholder="e.g., Traveling, Cooking, Hiking"></textarea>
            </div>
            <button type="submit" class="next-btn">Next</button>
        </form>
    </div>
</body>
</html>
