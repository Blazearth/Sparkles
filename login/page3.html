<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 3: Match Preferences</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <video autoplay muted loop class="video">
            <source src="2.mp4" type="video/mp4"></source>
        </video>
    </div>
    <div class="container">
        <h1>Step 3: Match Preferences</h1>
        <form action="page4.html" method="get">
            <div class="form-group">
                <label for="preferred-age">Preferred age range:</label>
                <input type="text" id="preferred-age" name="preferred_age" placeholder="e.g., 25-35" required>
            </div>
            <div class="form-group">
                <label for="location">Preferred location:</label>
                <input type="text" id="location" name="location" placeholder="e.g., New York" required>
            </div>
            <button type="submit" class="next-btn">Next</button>
        </form>
    </div>
</body>
</html>
