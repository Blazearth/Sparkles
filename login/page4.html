<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4: Personality Traits</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <video autoplay muted loop class="video">
            <source src="2.mp4" type="video/mp4"></source>
        </video>
    </div>
    <div class="container">
        <h1>Step 4: Personality Traits</h1>
        <form action="summary.html" method="get">
            <div class="form-group">
                <label for="traits">Describe your personality in three words:</label>
                <input type="text" id="traits" name="traits" placeholder="e.g., Funny, Ambitious, Kind" required>
            </div>
            <div class="form-group">
                <label for="hobbies">What are your hobbies?</label>
                <textarea id="hobbies" name="hobbies" rows="4" placeholder="e.g., Painting, Reading"></textarea>
            </div>
            <button type="submit" class="next-btn">Next</button>
        </form>
    </div>
</body>
</html>
